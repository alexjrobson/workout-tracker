services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: workoutdb
      POSTGRES_USER: workout_user
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout_user -d workoutdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/workoutdb
      SPRING_DATASOURCE_USERNAME: workout_user
      SPRING_DATASOURCE_PASSWORD: strongpassword
      # Override this with your own secret for anything beyond local use.
      JWT_SECRET: mysecretkey123mysecretkey123mysecretkey123
    ports:
      - "8080:8080"

volumes:
  pgdata:
